name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Check the tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi
      - name: Test
        run: |
          pip install -e ".[dev,app,reports]"  # all tests run, none skipped
          pytest -q
      - name: Validation (reference cases)
        run: python validation/run_validation.py
      - name: Keep the validation report of this release
        uses: actions/upload-artifact@v4
        with:
          name: validation-report-${{ github.ref_name }}
          path: validation/report.md
          retention-days: 90
      - name: Build sdist and wheel
        run: python -m build
      - name: Check package metadata
        run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/labqc/
    permissions:
      id-token: write  # trusted publishing: PyPI gets a short-lived token from GitHub
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
